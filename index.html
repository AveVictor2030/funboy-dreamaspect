<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halloween 2026 Collection</title>
    <meta
      name="description"
      content="September–October content plan for Funboy."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&family=Red+Hat+Display:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=77" />
  </head>
  <body>
    <div class="gate" id="gate">
      <form class="gate-card" id="gateForm">
        <p class="gate-kicker">Halloween 2026 Collection</p>
        <h1>Enter password</h1>
        <label class="gate-label" for="gatePass">Password</label>
        <input
          id="gatePass"
          type="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="gate-btn">Enter</button>
        <p class="gate-err" id="gateErr" hidden>Wrong password</p>
      </form>
    </div>
    <div class="table">
      <header class="mast">
        <div>
          <h1>Halloween 2026 Collection</h1>
          <p class="plan-count" id="planCount">content strategy</p>
          <p class="group-legend" id="groupLegend"></p>
        </div>
        <div class="views" role="group" aria-label="Board view">
          <button type="button" class="view-btn" id="viewShoots" data-view="oct">
            Oct
          </button>
          <button type="button" class="view-btn" id="viewIdeas" data-view="ideas">
            Ideas
          </button>
          <button type="button" class="view-btn" id="viewProduction" data-view="production">
            Production
          </button>
          <button type="button" class="view-btn" id="viewObjective" data-view="objective">
            Objective
          </button>
          <button type="button" class="view-btn" id="viewReports" data-view="reports">
            Social reports
          </button>
        </div>
      </header>
      <section class="board" aria-label="Campaign board">
        <div class="map">
          <div class="trail" aria-hidden="true"></div>
          <div class="lands" id="hexRow"></div>
        </div>
      </section>
    </div>
    <script>
      (function () {
        var KEY = "funboy-map-gate";
        var PASS = "growth";
        function unlock() {
          document.body.classList.add("is-unlocked");
          try {
            sessionStorage.setItem(KEY, "1");
          } catch (err) {}
        }
        try {
          if (sessionStorage.getItem(KEY) === "1") unlock();
        } catch (err) {}
        var form = document.getElementById("gateForm");
        var field = document.getElementById("gatePass");
        var err = document.getElementById("gateErr");
        if (!document.body.classList.contains("is-unlocked") && field) field.focus();
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (field.value === PASS) unlock();
          else {
            err.hidden = false;
            field.select();
          }
        });
      })();
    </script>
    <script src="data.js?v=77"></script>
    <script src="app.js?v=77"></script>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v3d52b47920f24c319d37e2661827c42b1787588026925" integrity="sha512-d9sL6GJLXn6fInD1+TVXhTcQOsmxeHfmHAvwGDIxp5TO+uo1fiWW7mHomMj4MLRlCsJDTqXzWLHJFFlPCEIj/A==" data-cf-beacon='{"version":"2024.11.0","token":"de6de096768a44e088cf48fd54dfa5d9","r":1}' crossorigin="anonymous"></script>
</body>
</html>
